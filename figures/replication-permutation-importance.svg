<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc">
<title id="title">Held-out permutation importance audit</title>
<desc id="desc">A diverging horizontal bar chart of held-out permutation importance from the deterministic sensitivity analysis.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
.title { font-size: 30px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #526079; }
.label { font-size: 16px; }
.small { font-size: 13px; fill: #526079; }
.value { font-size: 14px; font-weight: 650; }
.axis { stroke: #b8c1d1; stroke-width: 1; }
.grid { stroke: #e7eaf0; stroke-width: 1; }
</style>
<text x="48" y="51" class="title">Held-out permutation audit</text>
<text x="48" y="80" class="subtitle">Mean change in balanced accuracy across 50 test folds</text>
<line x1="620" y1="108" x2="620" y2="664" stroke="#596579" stroke-width="1.5"/>
<text x="48" y="143" class="label">Unemployment-insurance awareness</text>
<rect x="620.00" y="120" width="373.91" height="30" rx="3" fill="#087f5b"/>
<text x="1068" y="141" class="value">+0.074</text>
<text x="1130" y="141" class="small">SD 0.049</text>
<text x="48" y="192" class="label">Carbon-policy awareness</text>
<rect x="620.00" y="169" width="367.23" height="30" rx="3" fill="#087f5b"/>
<text x="1068" y="190" class="value">+0.073</text>
<text x="1130" y="190" class="small">SD 0.047</text>
<text x="48" y="241" class="label">Age</text>
<rect x="620.00" y="218" width="194.79" height="30" rx="3" fill="#087f5b"/>
<text x="1068" y="239" class="value">+0.039</text>
<text x="1130" y="239" class="small">SD 0.051</text>
<text x="48" y="290" class="label">Log savings</text>
<rect x="620.00" y="267" width="190.10" height="30" rx="3" fill="#087f5b"/>
<text x="1068" y="288" class="value">+0.038</text>
<text x="1130" y="288" class="small">SD 0.047</text>
<text x="48" y="339" class="label">Years of education</text>
<rect x="620.00" y="316" width="76.06" height="30" rx="3" fill="#087f5b"/>
<text x="1068" y="337" class="value">+0.015</text>
<text x="1130" y="337" class="small">SD 0.037</text>
<text x="48" y="388" class="label">Ambiguity-aversion score</text>
<rect x="620.00" y="365" width="34.64" height="30" rx="3" fill="#087f5b"/>
<text x="1068" y="386" class="value">+0.007</text>
<text x="1130" y="386" class="small">SD 0.038</text>
<text x="48" y="437" class="label">Earnings motive</text>
<rect x="618.37" y="414" width="1.63" height="30" rx="3" fill="#b42318"/>
<text x="1068" y="435" class="value">-0.000</text>
<text x="1130" y="435" class="small">SD 0.002</text>
<text x="48" y="486" class="label">Gender indicator</text>
<rect x="613.93" y="463" width="6.07" height="30" rx="3" fill="#b42318"/>
<text x="1068" y="484" class="value">-0.001</text>
<text x="1130" y="484" class="small">SD 0.015</text>
<text x="48" y="535" class="label">Marital-status encoding</text>
<rect x="584.69" y="512" width="35.31" height="30" rx="3" fill="#b42318"/>
<text x="1068" y="533" class="value">-0.007</text>
<text x="1130" y="533" class="small">SD 0.027</text>
<text x="48" y="584" class="label">Job/major fit motive</text>
<rect x="580.99" y="561" width="39.01" height="30" rx="3" fill="#b42318"/>
<text x="1068" y="582" class="value">-0.008</text>
<text x="1130" y="582" class="small">SD 0.024</text>
<text x="48" y="633" class="label">Proximity motive</text>
<rect x="568.72" y="610" width="51.28" height="30" rx="3" fill="#b42318"/>
<text x="1068" y="631" class="value">-0.010</text>
<text x="1130" y="631" class="small">SD 0.021</text>
<text x="48" y="723" class="small">Positive values indicate lower held-out balanced accuracy after permutation; negative values reflect sampling noise or instability.</text>
</svg>
