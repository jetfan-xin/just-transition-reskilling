<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Willingness by policy scenario</title>
<desc id="desc">Four stacked bars show response distributions from very unwilling to very willing.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
